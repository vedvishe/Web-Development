<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animated Login Form</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-container {
        width: 350px;
        padding: 40px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: #fff;
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .input-group {
        position: relative;
        margin-bottom: 25px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 10px;
        background: transparent;
        border: none;
        border-bottom: 2px solid #fff;
        outline: none;
        color: #fff;
        font-size: 16px;
    }

    .input-group label {
        position: absolute;
        left: 10px;
        top: 12px;
        color: #ddd;
        pointer-events: none;
        transition: 0.3s ease;
    }

    .input-group input:focus ~ label,
    .input-group input:valid ~ label {
        top: -10px;
        font-size: 12px;
        color: #fff;
    }

    .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .options label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
    }

    .options a {
        color: #fff;
        text-decoration: none;
    }

    .options a:hover {
        text-decoration: underline;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 30px;
        background: #fff;
        color: #764ba2;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
    }

    button:hover {
        background: #764ba2;
        color: #fff;
        transform: scale(1.05);
    }

    .signup {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }

    .signup a {
        color: #fff;
        font-weight: bold;
        text-decoration: none;
    }

    .signup a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>
    <form>
        <div class="input-group">
            <input type="text" required />
            <label>Email</label>
        </div>

        <div class="input-group">
            <input type="password" required />
            <label>Password</label>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" />
                Remember me
            </label>
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="signup">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </form>
</div>

</body>
</html>
